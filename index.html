<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸설월여고 갸루 디지털 현미경 사진전🌸</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts (Gaegu & Gowun Batang for Gyaru aesthetic) -->
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #FFF0F5; /* LavenderBlush 연분홍 */
      background-image: 
        radial-gradient(#FFB6C1 1.5px, transparent 1.5px),
        radial-gradient(#FFB6C1 1.5px, #FFF0F5 1.5px);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
    }
    .font-gyaru {
      font-family: 'Gaegu', cursive;
    }
    /* 갸루 핑크 스타일링 박스 그림자 */
    .gyaru-shadow {
      box-shadow: 6px 6px 0px #FF1493, 10px 10px 15px rgba(255, 105, 180, 0.3);
    }
    .gyaru-btn-shadow {
      box-shadow: 3px 3px 0px #C71585;
    }
    .gyaru-btn-shadow:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px #C71585;
    }
    .gyaru-btn-shadow:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #C71585;
    }
    /* 전광판 애니메이션 */
    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .animate-marquee {
      display: inline-block;
      white-space: nowrap;
      animation: marquee 18s linear infinite;
    }
    /* 마우스 클릭 시 생기는 반짝이 효과 */
    .click-sparkle {
      position: fixed;
      pointer-events: none;
      font-size: 24px;
      animation: popAndFade 0.8s ease-out forwards;
      z-index: 9999;
    }
    @keyframes popAndFade {
      0% { transform: scale(0.3) translateY(0); opacity: 1; }
      50% { transform: scale(1.3) translateY(-20px); opacity: 0.9; }
      100% { transform: scale(1) translateY(-40px); opacity: 0; }
    }
  </style>
</head>
<body class="text-gray-800 min-h-screen pb-16 relative selection:bg-pink-300 selection:text-pink-900">

  <!-- 클릭 파티클 컨테이너 -->
  <div id="sparkle-container"></div>

  <!-- Top Marquee Banner -->
  <div class="bg-gradient-to-r from-pink-500 via-rose-400 to-fuchsia-500 text-white font-bold py-2 overflow-hidden border-b-4 border-pink-300 shadow-sm">
    <div class="animate-marquee text-lg font-gyaru tracking-wider">
      ✨ 💖 2026 설월여자고등학교 디지털 현미경 사진전에 오신 것을 환영합니다! 🔬 🎀 세상에서 제일 유쾌하고 화려한 갸루 세포 관찰 기록집 💖 ✨
    </div>
  </div>

  <!-- Header -->
  <header class="max-w-5xl mx-auto px-4 pt-8 pb-6 text-center">
    <div class="inline-block relative">
      <span class="absolute -top-6 -left-6 text-4xl animate-bounce">💖</span>
      <span class="absolute -top-6 -right-6 text-4xl animate-bounce" style="animation-delay: 0.3s;">✨</span>
      <h1 class="text-4xl md:text-6xl font-black font-gyaru text-pink-600 tracking-wider drop-shadow-[0_3px_3px_rgba(255,105,180,0.5)]">
        🎀 설월여고 갸루 현미경 사진전 🔬
      </h1>
    </div>
    <p class="mt-3 text-pink-700 font-bold text-lg md:text-xl">
      "세포도, 미생물도 갸루스럽게 키라키라(✨)하게 관찰하자구~★"
    </p>

    <!-- Upload Button trigger -->
    <div class="mt-6 flex justify-center">
      <button onclick="openCreateModal()" class="gyaru-btn-shadow bg-gradient-to-r from-pink-400 to-fuchsia-500 hover:from-pink-500 hover:to-fuchsia-600 text-white font-black text-xl py-3 px-8 rounded-full border-4 border-white transition flex items-center gap-3">
        <i class="fa-solid fa-camera-retro text-2xl"></i>
        <span>내 현미경 사진 올리기 (클릭! 💖)</span>
      </button>
    </div>
  </header>

  <!-- Filter & Search Section -->
  <main class="max-w-5xl mx-auto px-4">
    <div class="bg-white/90 backdrop-blur-sm p-4 md:p-6 rounded-3xl border-4 border-pink-300 gyaru-shadow mb-8">
      <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
        <!-- Category Buttons -->
        <div class="flex flex-wrap gap-2 justify-center" id="category-buttons">
          <button onclick="setCategory('전체')" class="cat-btn bg-pink-500 text-white px-4 py-2 rounded-full font-bold text-sm border-2 border-pink-300">전체 💖</button>
          <button onclick="setCategory('식물세포')" class="cat-btn bg-pink-100 text-pink-600 hover:bg-pink-200 px-4 py-2 rounded-full font-bold text-sm border-2 border-pink-300">식물세포 🌿</button>
          <button onclick="setCategory('동물세포')" class="cat-btn bg-pink-100 text-pink-600 hover:bg-pink-200 px-4 py-2 rounded-full font-bold text-sm border-2 border-pink-300">동물세포 🐶</button>
          <button onclick="setCategory('미생물')" class="cat-btn bg-pink-100 text-pink-600 hover:bg-pink-200 px-4 py-2 rounded-full font-bold text-sm border-2 border-pink-300">미생물 🦠</button>
          <button onclick="setCategory('기타')" class="cat-btn bg-pink-100 text-pink-600 hover:bg-pink-200 px-4 py-2 rounded-full font-bold text-sm border-2 border-pink-300">기타 🔮</button>
        </div>

        <!-- Search Input -->
        <div class="relative w-full md:w-64">
          <input type="text" id="search-input" oninput="renderPosts()" placeholder="제목 또는 작성자 검색..." class="w-full pl-10 pr-4 py-2 bg-pink-50 border-2 border-pink-300 rounded-full focus:outline-none focus:ring-2 focus:ring-pink-500 text-pink-900 font-bold placeholder-pink-300">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-pink-400"></i>
        </div>
      </div>
    </div>

    <!-- Posts Grid -->
    <div id="posts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- JavaScript will dynamically render post cards here -->
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="mt-16 text-center text-pink-600 font-bold py-6 border-t-2 border-pink-200 bg-pink-50/50">
    <p class="font-gyaru text-xl">🌸 2026 설월여자고등학교 과학실x갸루동아리 🌸</p>
    <p class="text-xs text-pink-400 mt-1">Digital Microscope Photo Exhibition • Created with Gyaru Vibe ✨</p>
  </footer>

  <!-- ==================== MODALS ==================== -->

  <!-- 1. CREATE / EDIT POST MODAL -->
  <div id="post-modal" class="fixed inset-0 bg-black/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl border-4 border-pink-400 max-w-lg w-full p-6 gyaru-shadow max-h-[90vh] overflow-y-auto relative">
      <button onclick="closePostModal()" class="absolute top-4 right-4 text-pink-400 hover:text-pink-600 text-2xl font-bold">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <h2 id="modal-title" class="text-2xl font-black font-gyaru text-pink-600 mb-4 text-center">✨ 새 현미경 사진 올리기 ✨</h2>

      <form id="post-form" onsubmit="handlePostFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="edit-post-id" value="">

        <div>
          <label class="block text-sm font-bold text-pink-600 mb-1">작품 제목 💕</label>
          <input type="text" id="form-title" required placeholder="예: 양파 표피세포 선홍빛 핵 발견! ✨" class="w-full p-2.5 bg-pink-50 border-2 border-pink-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 font-bold">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-bold text-pink-600 mb-1">작성자 (반/이름) 🎀</label>
            <input type="text" id="form-author" required placeholder="2학년 3반 김갸루" class="w-full p-2.5 bg-pink-50 border-2 border-pink-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 font-bold">
          </div>
          <div>
            <label class="block text-sm font-bold text-pink-600 mb-1">카테고리 🏷️</label>
            <select id="form-category" class="w-full p-2.5 bg-pink-50 border-2 border-pink-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 font-bold">
              <option value="식물세포">식물세포 🌿</option>
              <option value="동물세포">동물세포 🐶</option>
              <option value="미생물">미생물 🦠</option>
              <option value="기타">기타 🔮</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-pink-600 mb-1">현미경 사진 첨부 📷</label>
          <input type="file" id="form-file" accept="image/*" onchange="previewImageFile(event)" class="w-full p-2 bg-pink-50 border-2 border-pink-300 rounded-xl text-sm text-pink-700 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-pink-400 file:text-white hover:file:bg-pink-500">
          <p class="text-xs text-pink-400 mt-1">* 내 컴퓨터의 사진 파일을 직접 올릴 수 있어요!</p>
        </div>

        <!-- Preview Image Container -->
        <div id="image-preview-container" class="hidden text-center border-2 border-dashed border-pink-300 p-2 rounded-xl bg-pink-50">
          <img id="image-preview" src="" alt="미리보기" class="max-h-40 mx-auto rounded-lg border-2 border-pink-200 object-contain">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-bold text-pink-600 mb-1">관찰 배율 🔬</label>
            <input type="text" id="form-magnification" placeholder="예: 100x" class="w-full p-2.5 bg-pink-50 border-2 border-pink-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 font-bold">
          </div>
          <div>
            <label class="block text-sm font-bold text-pink-600 mb-1">염색약 🧪</label>
            <input type="text" id="form-stain" placeholder="예: 아세토카민" class="w-full p-2.5 bg-pink-50 border-2 border-pink-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 font-bold">
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-pink-600 mb-1">관찰 소감 & 설명 📝</label>
          <textarea id="form-description" rows="3" placeholder="세포를 관찰하면서 느낀 갸루스런 감상을 적어주세요! 💕" class="w-full p-2.5 bg-pink-50 border-2 border-pink-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 font-bold"></textarea>
        </div>

        <button type="submit" class="w-full py-3 bg-gradient-to-r from-pink-400 to-fuchsia-500 hover:from-pink-500 hover:to-fuchsia-600 text-white font-black rounded-xl text-lg gyaru-btn-shadow border-2 border-white transition">
          게시글 저장하기 💖
        </button>
      </form>
    </div>
  </div>

  <!-- 2. POST DETAIL & COMMENT MODAL -->
  <div id="detail-modal" class="fixed inset-0 bg-black/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl border-4 border-pink-400 max-w-2xl w-full p-6 gyaru-shadow max-h-[90vh] overflow-y-auto relative">
      <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-pink-400 hover:text-pink-600 text-2xl font-bold">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div id="detail-content">
        <!-- JavaScript will dynamically fill post details here -->
      </div>
    </div>
  </div>


  <!-- ==================== JAVASCRIPT LOGIC ==================== -->
  <script>
    // Initial Posts Data
    let posts = [
      {
        id: 'post-101',
        title: '양파 표피세포 선홍빛 핵 발견! ✨',
        author: '2학년 3반 김갸루 💖',
        category: '식물세포',
        imageUrl: 'https://images.unsplash.com/photo-1530026405186-ed1f139313f8?auto=format&fit=crop&w=800&q=80',
        description: '아세토카민 용액으로 염색한 양파 표피세포예요! 선명하게 보이는 선홍빛 핵이 완전 키라키라(✨)해요!! 100배율로 촬영했답니다~ 💕',
        magnification: '100x',
        stain: '아세토카민',
        likes: 24,
        createdAt: '2026-11-10 14:20',
        comments: [
          { id: 'c-1', author: '1학년 1반 이예쁜', text: '우와 진짜 핵이 보라핑쿠하게 잘 나왔다! 대박 💕', createdAt: '14:25' },
          { id: 'c-2', author: '2학년 3반 최아름', text: '염색 너무 잘됐다!! 갸루 파워 돋네 🌸', createdAt: '14:30' }
        ]
      },
      {
        id: 'post-102',
        title: '짚신벌레의 비밀 댄스 파티! 🦠',
        author: '1학년 5반 박세포 ✨',
        category: '미생물',
        imageUrl: 'https://images.unsplash.com/photo-1576086213369-97a306d36557?auto=format&fit=crop&w=800&q=80',
        description: '연못물 채취해서 관찰한 짚신벌레! 섬모로 빠르게 헤엄치는 모습이 완전 힙해요! 400배율 고배율로 포착 성공! 🔥✨',
        magnification: '400x',
        stain: '무염색 (생체)',
        likes: 19,
        createdAt: '2026-11-10 15:05',
        comments: [
          { id: 'c-3', author: '3학년 2반 정생물', text: '움직이는 속도 장난 아닌데 캡처 잘했네 👏', createdAt: '15:10' }
        ]
      },
      {
        id: 'post-103',
        title: '장미 꽃잎 표피 기공의 숨결 🌹',
        author: '2학년 1반 정화려 🎀',
        category: '식물세포',
        imageUrl: 'https://images.unsplash.com/photo-1581093588401-fbb62a02f120?auto=format&fit=crop&w=800&q=80',
        description: '학교 화단 장미 꽃잎을 투명 테이프로 떼어내서 관찰했어요! 공변세포 사이에 기공이 살짝 열려있는 모습이 하트 모양 같아요 💖',
        magnification: '200x',
        stain: '무염색',
        likes: 31,
        createdAt: '2026-11-10 16:40',
        comments: []
      }
    ];

    let currentCategory = '전체';
    let currentDetailPostId = null;
    let uploadedImageDataUrl = '';

    // Initialize Page
    window.onload = function() {
      renderPosts();

      // Sparkle click effect handler
      document.addEventListener('click', function(e) {
        createClickSparkle(e.clientX, e.clientY);
      });
    };

    // Global Click Sparkle animation generator
    function createClickSparkle(x, y) {
      const sparkle = document.createElement('div');
      sparkle.className = 'click-sparkle';
      const sparkles = ['✨', '💖', '🌸', '🎀', '⭐', '💫'];
      sparkle.innerText = sparkles[Math.floor(Math.random() * sparkles.length)];
      sparkle.style.left = (x - 10) + 'px';
      sparkle.style.top = (y - 10) + 'px';
      document.getElementById('sparkle-container').appendChild(sparkle);

      setTimeout(() => {
        sparkle.remove();
      }, 800);
    }

    // Category Filter Handler
    function setCategory(cat) {
      currentCategory = cat;
      const buttons = document.querySelectorAll('.cat-btn');
      buttons.forEach(btn => {
        if (btn.innerText.includes(cat)) {
          btn.className = 'cat-btn bg-pink-500 text-white px-4 py-2 rounded-full font-bold text-sm border-2 border-pink-300';
        } else {
          btn.className = 'cat-btn bg-pink-100 text-pink-600 hover:bg-pink-200 px-4 py-2 rounded-full font-bold text-sm border-2 border-pink-300';
        }
      });
      renderPosts();
    }

    // Render Posts Cards
    function renderPosts() {
      const grid = document.getElementById('posts-grid');
      const searchTerm = document.getElementById('search-input').value.toLowerCase();

      const filtered = posts.filter(post => {
        const matchesCategory = currentCategory === '전체' || post.category === currentCategory;
        const matchesSearch = post.title.toLowerCase().includes(searchTerm) ||
                              post.author.toLowerCase().includes(searchTerm) ||
                              post.description.toLowerCase().includes(searchTerm);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 bg-white/70 rounded-3xl border-2 border-pink-300">
            <p class="text-4xl mb-2">🥺💖</p>
            <p class="text-pink-600 font-bold text-lg">조건에 맞는 현미경 사진이 없어요!</p>
            <p class="text-pink-400 text-sm mt-1">오른쪽 상단 버튼을 눌러 첫 사진을 작성해봐요~✨</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(post => `
        <div class="bg-white rounded-3xl border-4 border-pink-300 gyaru-shadow overflow-hidden flex flex-col justify-between hover:-translate-y-1 transition duration-200">
          <div>
            <!-- Image Frame -->
            <div class="relative bg-pink-100 h-52 overflow-hidden border-b-4 border-pink-200 cursor-pointer" onclick="openDetailModal('${post.id}')">
              <img src="${post.imageUrl}" alt="${post.title}" class="w-full h-full object-cover hover:scale-105 transition duration-300" onerror="this.src='https://images.unsplash.com/photo-1530026405186-ed1f139313f8?auto=format&fit=crop&w=800&q=80'">
              <span class="absolute top-3 left-3 bg-pink-500 text-white font-bold text-xs px-3 py-1 rounded-full border border-white">
                ${post.category}
              </span>
              <span class="absolute bottom-3 right-3 bg-black/60 text-white font-bold text-xs px-2.5 py-1 rounded-full backdrop-blur-xs">
                🔬 ${post.magnification || '100x'}
              </span>
            </div>

            <!-- Card Body -->
            <div class="p-5">
              <div class="flex items-center justify-between text-xs text-pink-500 font-bold mb-1">
                <span>👤 ${post.author}</span>
                <span>📅 ${post.createdAt.substring(0, 10)}</span>
              </div>
              <h3 class="text-xl font-bold font-gyaru text-pink-600 line-clamp-1 cursor-pointer hover:text-pink-700" onclick="openDetailModal('${post.id}')">
                ${post.title}
              </h3>
              <p class="text-gray-600 text-sm mt-2 line-clamp-2">
                ${post.description}
              </p>
            </div>
          </div>

          <!-- Card Footer -->
          <div class="px-5 pb-5 pt-2 border-t border-pink-100 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <button onclick="likePost('${post.id}', event)" class="text-pink-500 hover:text-pink-600 font-bold text-sm flex items-center gap-1 bg-pink-50 px-3 py-1 rounded-full border border-pink-200">
                ❤️ <span>${post.likes}</span>
              </button>
              <button onclick="openDetailModal('${post.id}')" class="text-pink-400 hover:text-pink-600 font-bold text-sm flex items-center gap-1">
                💬 <span>${post.comments.length}</span>
              </button>
            </div>

            <!-- Edit & Delete Buttons -->
            <div class="flex items-center gap-1">
              <button onclick="openEditModal('${post.id}', event)" title="수정" class="p-1.5 text-pink-400 hover:text-pink-600 hover:bg-pink-100 rounded-lg">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              <button onclick="deletePost('${post.id}', event)" title="삭제" class="p-1.5 text-rose-400 hover:text-rose-600 hover:bg-rose-100 rounded-lg">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Image File Selection & Preview Handler
    function previewImageFile(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          uploadedImageDataUrl = e.target.result;
          const previewImg = document.getElementById('image-preview');
          const previewContainer = document.getElementById('image-preview-container');
          previewImg.src = uploadedImageDataUrl;
          previewContainer.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    // Open Modal for New Post Creation
    function openCreateModal() {
      document.getElementById('edit-post-id').value = '';
      document.getElementById('modal-title').innerText = '✨ 새 현미경 사진 올리기 ✨';
      document.getElementById('post-form').reset();
      uploadedImageDataUrl = '';
      document.getElementById('image-preview-container').classList.add('hidden');
      
      const modal = document.getElementById('post-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    // Open Modal for Edit Post
    function openEditModal(postId, event) {
      if (event) event.stopPropagation();
      const post = posts.find(p => p.id === postId);
      if (!post) return;

      document.getElementById('edit-post-id').value = post.id;
      document.getElementById('modal-title').innerText = '💖 게시물 수정하기 💖';
      document.getElementById('form-title').value = post.title;
      document.getElementById('form-author').value = post.author;
      document.getElementById('form-category').value = post.category;
      document.getElementById('form-magnification').value = post.magnification || '100x';
      document.getElementById('form-stain').value = post.stain || '무염색';
      document.getElementById('form-description').value = post.description;

      uploadedImageDataUrl = post.imageUrl;
      const previewImg = document.getElementById('image-preview');
      const previewContainer = document.getElementById('image-preview-container');
      previewImg.src = post.imageUrl;
      previewContainer.classList.remove('hidden');

      const modal = document.getElementById('post-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closePostModal() {
      const modal = document.getElementById('post-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // CREATE / EDIT Form Submit (Fixes duplicate post issue by using unique IDs!)
    function handlePostFormSubmit(e) {
      e.preventDefault();

      const editId = document.getElementById('edit-post-id').value;
      const title = document.getElementById('form-title').value.trim();
      const author = document.getElementById('form-author').value.trim();
      const category = document.getElementById('form-category').value;
      const magnification = document.getElementById('form-magnification').value.trim() || '100x';
      const stain = document.getElementById('form-stain').value.trim() || '무염색';
      const description = document.getElementById('form-description').value.trim();

      const finalImageUrl = uploadedImageDataUrl || 'https://images.unsplash.com/photo-1530026405186-ed1f139313f8?auto=format&fit=crop&w=800&q=80';

      if (editId) {
        // Edit Mode
        posts = posts.map(p => {
          if (p.id === editId) {
            return {
              ...p,
              title,
              author,
              category,
              magnification,
              stain,
              description,
              imageUrl: finalImageUrl
            };
          }
          return p;
        });
      } else {
        // Create Mode - UNIQUE ID GENERATION TO PREVENT OVERWRITING
        const newPost = {
          id: 'post-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
          title,
          author,
          category,
          imageUrl: finalImageUrl,
          description,
          magnification,
          stain,
          likes: 0,
          createdAt: new Date().toISOString().replace('T', ' ').substring(0, 16),
          comments: []
        };
        posts.unshift(newPost);
      }

      closePostModal();
      renderPosts();

      if (currentDetailPostId && editId === currentDetailPostId) {
        renderDetailContent(editId);
      }
    }

    // Delete Post
    function deletePost(postId, event) {
      if (event) event.stopPropagation();
      if (confirm('정말로 이 영롱한 현미경 사진을 삭제할까요? 🥺💖')) {
        posts = posts.filter(p => p.id !== postId);
        renderPosts();
        if (currentDetailPostId === postId) {
          closeDetailModal();
        }
      }
    }

    // Like Post
    function likePost(postId, event) {
      if (event) event.stopPropagation();
      posts = posts.map(p => {
        if (p.id === postId) {
          return { ...p, likes: p.likes + 1 };
        }
        return p;
      });
      renderPosts();
      if (currentDetailPostId === postId) {
        renderDetailContent(postId);
      }
    }

    // Open Post Detail Modal
    function openDetailModal(postId) {
      currentDetailPostId = postId;
      renderDetailContent(postId);
      const modal = document.getElementById('detail-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeDetailModal() {
      const modal = document.getElementById('detail-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      currentDetailPostId = null;
    }

    // Render Detail Modal Content
    function renderDetailContent(postId) {
      const post = posts.find(p => p.id === postId);
      if (!post) return;

      const container = document.getElementById('detail-content');
      container.innerHTML = `
        <!-- Image & Tags -->
        <div class="relative rounded-2xl overflow-hidden border-4 border-pink-300 mb-4 bg-black/90">
          <img src="${post.imageUrl}" alt="${post.title}" class="w-full max-h-96 object-contain mx-auto" onerror="this.src='https://images.unsplash.com/photo-1530026405186-ed1f139313f8?auto=format&fit=crop&w=800&q=80'">
        </div>

        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
          <div class="flex items-center gap-2">
            <span class="bg-pink-500 text-white font-bold text-xs px-3 py-1 rounded-full">
              ${post.category}
            </span>
            <span class="bg-pink-100 text-pink-700 font-bold text-xs px-3 py-1 rounded-full border border-pink-300">
              🔬 ${post.magnification || '100x'}
            </span>
            <span class="bg-pink-100 text-pink-700 font-bold text-xs px-3 py-1 rounded-full border border-pink-300">
              🧪 ${post.stain || '무염색'}
            </span>
          </div>
          <span class="text-xs text-pink-400 font-bold">📅 ${post.createdAt}</span>
        </div>

        <h2 class="text-2xl font-black font-gyaru text-pink-600 mb-1">${post.title}</h2>
        <p class="text-sm font-bold text-pink-500 mb-4">작성자: ${post.author}</p>

        <div class="bg-pink-50 p-4 rounded-2xl border-2 border-pink-200 text-pink-900 font-medium mb-6 text-sm leading-relaxed whitespace-pre-line">
          ${post.description}
        </div>

        <!-- Like Button -->
        <div class="flex justify-center mb-6">
          <button onclick="likePost('${post.id}')" class="gyaru-btn-shadow bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 px-6 rounded-full border-2 border-white flex items-center gap-2 text-lg">
            <span>💖 좋아요</span>
            <span class="bg-white text-pink-600 px-2.5 py-0.5 rounded-full text-sm font-black">${post.likes}</span>
          </button>
        </div>

        <!-- Comments Section -->
        <div class="border-t-2 border-pink-200 pt-5">
          <h3 class="text-lg font-bold font-gyaru text-pink-600 mb-3 flex items-center gap-2">
            <span>💬 갸루들의 댓글 수다방</span>
            <span class="text-xs bg-pink-200 text-pink-700 px-2 py-0.5 rounded-full">${post.comments.length}</span>
          </h3>

          <!-- Add Comment Form -->
          <form onsubmit="handleAddComment(event, '${post.id}')" class="flex flex-col gap-2 mb-5">
            <div class="flex gap-2">
              <input type="text" id="comment-author" required placeholder="이름 (예: 1학년 이예쁜)" class="w-1/3 p-2 bg-pink-50 border-2 border-pink-200 rounded-xl text-xs font-bold text-pink-900">
              <input type="text" id="comment-text" required placeholder="칭찬과 감상의 한마디를 적어줘! 💕" class="w-2/3 p-2 bg-pink-50 border-2 border-pink-200 rounded-xl text-xs font-bold text-pink-900">
            </div>
            <button type="submit" class="self-end py-1.5 px-5 bg-pink-500 hover:bg-pink-600 text-white font-bold text-xs rounded-xl border border-pink-300">
              댓글 등록 🎀
            </button>
          </form>

          <!-- Comment List -->
          <div class="space-y-2 max-h-48 overflow-y-auto">
            ${post.comments.length === 0 ? `
              <p class="text-xs text-center text-pink-400 py-3">첫 번째 핑크 댓글을 남겨주세요! 🌸</p>
            ` : post.comments.map(c => `
              <div class="bg-pink-50/80 p-3 rounded-xl border border-pink-200 flex items-start justify-between text-xs">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-pink-600">${c.author}</span>
                    <span class="text-[10px] text-pink-300">${c.createdAt}</span>
                  </div>
                  <p class="text-pink-900 mt-1 font-medium">${c.text}</p>
                </div>
                <div class="flex items-center gap-1">
                  <button onclick="promptEditComment('${post.id}', '${c.id}', '${c.text}')" class="text-pink-400 hover:text-pink-600 p-1">
                    <i class="fa-solid fa-pen"></i>
                  </button>
                  <button onclick="deleteComment('${post.id}', '${c.id}')" class="text-rose-400 hover:text-rose-600 p-1">
                    <i class="fa-solid fa-xmark"></i>
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // Add Comment
    function handleAddComment(e, postId) {
      e.preventDefault();
      const author = document.getElementById('comment-author').value.trim();
      const text = document.getElementById('comment-text').value.trim();

      if (!author || !text) return;

      const newComment = {
        id: 'c-' + Date.now(),
        author,
        text,
        createdAt: new Date().toTimeString().substring(0, 5)
      };

      posts = posts.map(p => {
        if (p.id === postId) {
          return { ...p, comments: [...p.comments, newComment] };
        }
        return p;
      });

      renderPosts();
      renderDetailContent(postId);
    }

    // Edit Comment using Prompt
    function promptEditComment(postId, commentId, oldText) {
      const updatedText = prompt('댓글을 수정해보세요 💕', oldText);
      if (updatedText !== null && updatedText.trim() !== '') {
        posts = posts.map(p => {
          if (p.id === postId) {
            return {
              ...p,
              comments: p.comments.map(c => c.id === commentId ? { ...c, text: updatedText.trim() } : c)
            };
          }
          return p;
        });
        renderPosts();
        renderDetailContent(postId);
      }
    }

    // Delete Comment
    function deleteComment(postId, commentId) {
      if (confirm('댓글을 삭제할까요? 🎀')) {
        posts = posts.map(p => {
          if (p.id === postId) {
            return { ...p, comments: p.comments.filter(c => c.id !== commentId) };
          }
          return p;
        });
        renderPosts();
        renderDetailContent(postId);
      }
    }
  </script>
</body>
</html>
